<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic 8 Ball</title>
    <style>
        /* Base Styles & Mobile Readability */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Top Bar for About Button */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-end;
        }

        .about-btn {
            background: transparent;
            color: #aaaaaa;
            border: 1px solid #aaaaaa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .about-btn:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        /* Magic 8 Ball CSS Art */
        .ball-container {
            position: relative;
            margin-bottom: 40px;
        }

        .eight-ball {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 35% 25%, #555555, #000000 60%);
            border-radius: 50%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.9), 10px 15px 30px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .window {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #2a2a2a, #000000 80%);
            border-radius: 50%;
            border: 3px solid #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
        }

        /* The white circle with the 8 */
        .number-eight {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: #000000;
            position: absolute;
            transition: opacity 0.5s;
        }

        /* Container for the text answer */
        .answer-display {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            opacity: 0; /* Hidden by default */
            transition: opacity 1.5s ease-in;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Updated Text Styles */
        .answer-text {
            color: #e3f2fd;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            text-transform: uppercase;
            /* Deep blue glow/shadow to replace the physical triangle */
            text-shadow: 
                0px 2px 4px rgba(0,0,0,1), 
                0px 0px 15px rgba(26, 35, 126, 1), 
                0px 0px 25px rgba(26, 35, 126, 0.8);
        }

        /* Main Shake Button */
        .shake-btn {
            background: linear-gradient(135deg, #6200ea, #3700b3);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(98, 0, 234, 0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .shake-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(98, 0, 234, 0.4);
        }

        .shake-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            color: #aaa;
        }

        /* Shake Animation */
        .shaking {
            animation: shake-anim 0.4s ease-in-out infinite;
        }

        @keyframes shake-anim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 5px) rotate(5deg); }
            50% { transform: translate(0, 0) rotate(0deg); }
            75% { transform: translate(-5px, 5px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #222222;
            padding: 30px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #bb86fc;
        }

        .modal-content p {
            line-height: 1.5;
            color: #dddddd;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="about-btn" onclick="toggleModal(true)">About</button>
    </div>

    <div class="ball-container">
        <div class="eight-ball" id="magicBall">
            <div class="window">
                <div class="number-eight" id="numberEight">8</div>
                <div class="answer-display" id="answerDisplay">
                    <span class="answer-text" id="answerText"></span>
                </div>
            </div>
        </div>
    </div>

    <button class="shake-btn" id="shakeBtn" onclick="askQuestion()">Ask the 8 Ball</button>

    <div class="modal-overlay" id="aboutModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            <h2>About</h2>
            <p>Welcome to the Magic 8 Ball.</p>
            <p>Focus on your question, click the button, and let the universe decide your fate.</p>
            <p><strong>Contact:</strong><br>
               A product of TRI-Corporation.<br>
               tri-corp-tinkerer@pm.me<br>
			   ...<br>
			   Use responsibly... or not...               
			   </p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Change this value to adjust how long the ball shakes (in milliseconds)
        const SHAKE_DURATION_MS = 1000; 

        // The list of possible Magic 8 Ball answers
        const answers = [
            "It is certain",
            "It is decidedly so",
            "Without a doubt",
            "Yes definitely",
            "You may rely on it",
            "As I see it, yes",
            "Most likely",
            "Outlook good",
            "Yes",
            "Signs point to yes",
            "Reply hazy, try again",
            "Ask again later",
            "Better not tell you now",
            "Cannot predict now",
            "Concentrate and ask again",
            "Don't count on it",
            "My reply is no",
            "My sources say no",
            "Outlook not so good",
            "Very doubtful"
        ];

        // --- LOGIC ---
        const ball = document.getElementById('magicBall');
        const numberEight = document.getElementById('numberEight');
        const answerDisplay = document.getElementById('answerDisplay'); // Renamed from triangle
        const answerText = document.getElementById('answerText');
        const shakeBtn = document.getElementById('shakeBtn');

        function askQuestion() {
            // 1. Disable button to prevent spamming
            shakeBtn.disabled = true;
            shakeBtn.innerText = "Consulting the spirits...";

            // 2. Hide previous answer and show the '8' briefly
            answerDisplay.style.opacity = '0';
            setTimeout(() => {
                numberEight.style.opacity = '1';
                // 3. Start shaking animation
                ball.classList.add('shaking');
            }, 300); // Short delay to allow fade out

            // 4. Wait for the designated answer time (default 4 seconds)
            setTimeout(() => {
                // Stop shaking
                ball.classList.remove('shaking');
                
                // Pick a random answer
                const randomIndex = Math.floor(Math.random() * answers.length);
                answerText.innerText = answers[randomIndex];

                // Fade out '8', Fade in answer
                numberEight.style.opacity = '0';
                answerDisplay.style.opacity = '1';

                // Re-enable button
                shakeBtn.disabled = false;
                shakeBtn.innerText = "Ask Again";

            }, SHAKE_DURATION_MS);
        }

        // --- MODAL LOGIC ---
        const modal = document.getElementById('aboutModal');
        function toggleModal(show) {
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        // Close modal if user clicks outside the box
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                toggleModal(false);
            }
        });
    </script>
</body>
</html>
