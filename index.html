<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic 8 Ball</title>
    <style>
        /* Base Styles & Lighter Background */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #eceff1 0%, #90a4ae 100%);
            color: #333333;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Top Bar for About Button */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-end;
        }

        /* Adjusted About Button for Light Background */
        .about-btn {
            background: transparent;
            color: #455a64;
            border: 1px solid #455a64;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .about-btn:hover {
            color: #111111;
            border-color: #111111;
            background: rgba(255,255,255,0.2);
        }

        /* Magic 8 Ball CSS Art */
        .ball-container {
            position: relative;
            margin-bottom: 40px;
        }

        /* Richer 3D Shadows for Light Background */
        .eight-ball {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 35% 25%, #444444, #050505 60%, #000000 100%);
            border-radius: 50%;
            box-shadow: inset -10px -10px 25px rgba(0,0,0,0.8), 15px 25px 40px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The Glossy Reflection Highlight */
        .eight-ball::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 20px;
            width: 130px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.35), rgba(255,255,255,0.02));
            transform: rotate(-25deg);
            pointer-events: none; 
            z-index: 2;
        }

        /* Ensure window sits below the gloss for maximum realism */
        .window {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #2a2a2a, #000000 80%);
            border-radius: 50%;
            border: 3px solid #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
            z-index: 1; 
        }

        /* The white circle with the 8 */
        .number-eight {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: #000000;
            position: absolute;
            transition: opacity 0.5s;
        }

        /* Container for the text answer */
        .answer-display {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            opacity: 0; 
            transition: opacity 1.5s ease-in;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Glowing Blue Text Styles */
        .answer-text {
            color: #e3f2fd;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            text-transform: uppercase;
            text-shadow: 
                0px 2px 4px rgba(0,0,0,1), 
                0px 0px 15px rgba(26, 35, 126, 1), 
                0px 0px 25px rgba(26, 35, 126, 0.8);
        }

        /* Main Shake Button */
        .shake-btn {
            background: linear-gradient(135deg, #6200ea, #3700b3);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(98, 0, 234, 0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
            z-index: 5;
        }

        .shake-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(98, 0, 234, 0.4);
        }

        .shake-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            color: #aaa;
        }

        /* Initial Roll-in Animation */
        .roll-in-anim {
            animation: roll-in 1.2s cubic-bezier(0.21, 1.11, 0.81, 0.99) forwards;
        }

        @keyframes roll-in {
            0% { 
                transform: translateX(-120vw) rotate(-540deg); 
            }
            100% { 
                transform: translateX(0) rotate(0deg); 
            }
        }

        /* Shake Animation */
        .shaking {
            animation: shake-anim 0.4s ease-in-out infinite;
        }

        @keyframes shake-anim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 5px) rotate(5deg); }
            50% { transform: translate(0, 0) rotate(0deg); }
            75% { transform: translate(-5px, 5px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #222222;
            color: #dddddd;
            padding: 30px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #bb86fc;
        }

        .modal-content p {
            line-height: 1.5;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="about-btn" onclick="toggleModal(true)">About</button>
    </div>

    <div class="ball-container">
        <!-- Added roll-in-anim class here -->
        <div class="eight-ball roll-in-anim" id="magicBall">
            <div class="window">
                <div class="number-eight" id="numberEight">8</div>
                <div class="answer-display" id="answerDisplay">
                    <span class="answer-text" id="answerText"></span>
                </div>
            </div>
        </div>
    </div>

    <button class="shake-btn" id="shakeBtn" onclick="askQuestion()">Ask the 8 Ball</button>

    <div class="modal-overlay" id="aboutModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            <h2>About</h2>
            <p>Welcome to the Magic 8 Ball.</p>
            <p>Focus on your question, click the button, and let the universe decide your fate.</p>
            <p><strong>Contact:</strong><br>
               A product of TRI-Corporation.<br>
               tri-corp-tinkerer@pm.me<br>
			   ...<br>
			   Use responsibly... or not...               
			   </p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SHAKE_DURATION_MS = 1000; 

        const answers = [
            "It is certain",
            "It is decidedly so",
            "Without a doubt",
            "Yes definitely",
            "You may rely on it",
            "As I see it, yes",
            "Most likely",
            "Outlook good",
            "Yes",
            "Signs point to yes",
            "Reply hazy, try again",
            "Ask again later",
            "Better not tell you now",
            "Cannot predict now",
            "Concentrate and ask again",
            "Don't count on it",
            "My reply is no",
            "My sources say no",
            "Outlook not so good",
            "Very doubtful"
        ];

        // --- LOGIC ---
        const ball = document.getElementById('magicBall');
        const numberEight = document.getElementById('numberEight');
        const answerDisplay = document.getElementById('answerDisplay');
        const answerText = document.getElementById('answerText');
        const shakeBtn = document.getElementById('shakeBtn');

        // Clean up roll-in class after load so it doesn't conflict with shaking
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                ball.classList.remove('roll-in-anim');
            }, 1200); 
        });

        function askQuestion() {
            shakeBtn.disabled = true;
            shakeBtn.innerText = "Consulting the spirits...";

            answerDisplay.style.opacity = '0';
            setTimeout(() => {
                numberEight.style.opacity = '1';
                ball.classList.add('shaking');
            }, 300); 

            setTimeout(() => {
                ball.classList.remove('shaking');
                
                const randomIndex = Math.floor(Math.random() * answers.length);
                answerText.innerText = answers[randomIndex];

                numberEight.style.opacity = '0';
                answerDisplay.style.opacity = '1';

                shakeBtn.disabled = false;
                shakeBtn.innerText = "Ask Again";

            }, SHAKE_DURATION_MS);
        }

        // --- MODAL LOGIC ---
        const modal = document.getElementById('aboutModal');
        function toggleModal(show) {
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                toggleModal(false);
            }
        });
    </script>
</body>
</html>
